name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Install backend dependencies
        working-directory: backend-fastapi
        run: |
          # Install the exact backend dependencies declared by the application.
          # A failure here usually means requirements.txt contains an unavailable
          # package or a dependency constraint that cannot be resolved.
          python -m pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          # Install dependencies from the lockfile without changing it.
          # This keeps CI consistent with local and repeat workflow runs.
          npm ci

      - name: Build React app
        working-directory: frontend
        run: |
          # Compile the frontend bundle and fail CI if the Vite build reports errors.
          # Docker image creation and publication are handled only by deploy.yml.
          npm run build

      - name: Validate FastAPI Python files
        working-directory: backend-fastapi
        run: |
          # Compile Python modules to catch syntax errors without running the app.
          # The quiet flag keeps successful CI logs concise; failures still show details.
          python -m compileall -q .
