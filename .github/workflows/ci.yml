name: CI Pipeline

# Run checks for pull requests and pushes to main. Only pushes to main publish images.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Keep the workflow read-only by default. AWS OIDC permission is granted only
# to the publishing job below.
permissions:
  contents: read

jobs:
  # Run application checks before any container images are built or published.
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Use the repository's supported runtimes so build results are reproducible.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      # Install dependencies and run the frontend production build.
      - name: Install backend dependencies
        working-directory: backend-fastapi
        run: |
          # Install the exact backend dependencies declared by the application.
          # A failure here usually means requirements.txt contains an unavailable
          # package or a dependency constraint that cannot be resolved.
          python -m pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          # Install dependencies from the lockfile without changing it.
          # This keeps CI consistent with local and repeat workflow runs.
          npm ci

      - name: Build React app
        working-directory: frontend
        run: |
          # Compile the frontend bundle and fail CI if the Vite build reports errors.
          # Docker image creation and publication happen in the publish-images job.
          npm run build

      - name: Validate FastAPI Python files
        working-directory: backend-fastapi
        run: |
          # Compile Python modules to catch syntax errors without running the app.
          # The quiet flag keeps successful CI logs concise; failures still show details.
          python -m compileall -q .

  publish-images:
    name: Build and publish ECR images
    # Do not publish unless the application checks above pass.
    needs: build
    # The OIDC trust policy accepts only this repository's main branch.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required by GitHub to issue an OIDC token for AWS role assumption.
      id-token: write
    env:
      # These values must match the AWS region and ECR repositories in Terraform.
      AWS_REGION: us-east-1
      FRONTEND_REPO: frontend
      BACKEND_REPO: backend
      # Tag images with the triggering commit so each published build is traceable.
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build frontend image
        run: |
          # Build the frontend container from its Dockerfile and tag it with this commit.
          # The explicit latest tag makes the newest successful main build easy to find.
          docker build \
            --tag "$FRONTEND_REPO:$IMAGE_TAG" \
            --tag "$FRONTEND_REPO:latest" \
            ./frontend

      - name: Build backend image
        run: |
          # Build the backend container from its Dockerfile and tag it consistently
          # with the frontend image so both images can be traced to this commit.
          docker build \
            --tag "$BACKEND_REPO:$IMAGE_TAG" \
            --tag "$BACKEND_REPO:latest" \
            ./backend-fastapi

      # Report HIGH/CRITICAL OS and library findings without blocking the push,
      # matching the current policy. Set exit-code to "1" to block pushes on findings.
      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: backend:${{ github.sha }}
          format: table
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: frontend:${{ github.sha }}
          format: table
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      # Request short-lived AWS credentials only after code checks, image builds,
      # and scans complete. If this fails, check AWS_ROLE_ARN and the role's OIDC
      # trust conditions for this repository's main branch.
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Print the assumed identity to help diagnose AWS account/role configuration.
      - name: Verify AWS credentials
        run: |
          # Confirm that the OIDC role was assumed successfully and the AWS CLI is usable.
          aws sts get-caller-identity

      # Authenticate Docker to the registry in the AWS account from the assumed role.
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push images to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # Add the authenticated registry prefix, then push both commit-specific
          # and rolling latest tags. If a push fails, verify the repositories exist
          # in AWS_REGION and that the role permits writes to both repository ARNs.
          for repository in "$FRONTEND_REPO" "$BACKEND_REPO"; do
            docker tag "$repository:$IMAGE_TAG" "$ECR_REGISTRY/$repository:$IMAGE_TAG"
            docker tag "$repository:latest" "$ECR_REGISTRY/$repository:latest"
            docker push "$ECR_REGISTRY/$repository:$IMAGE_TAG"
            docker push "$ECR_REGISTRY/$repository:latest"
          done
