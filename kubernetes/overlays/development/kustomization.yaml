apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: development

resources:
  - ../../base
  - ../../base/postgres
  - namespace.yaml

patches:
  - path: backend_patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: backend
  - path: frontend_patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: frontend
  - path: backend-hpa-patch.yaml
    target:
      group: autoscaling
      version: v2
      kind: HorizontalPodAutoscaler
      name: backend-hpa
  - path: frontend-hpa-patch.yaml
    target:
      group: autoscaling
      version: v2
      kind: HorizontalPodAutoscaler
      name: frontend-hpa
