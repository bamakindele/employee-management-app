apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend

  namespace: production

env:

- name: DB_USERNAME

  valueFrom:

    secretKeyRef:

      name: postgres-secret

      key: db_username

- name: DB_PASSWORD

  valueFrom:

    secretKeyRef:

      name: postgres-secret

      key: db_password

spec:

  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:

    metadata:
      labels:
        app: backend

    spec:

      containers:

      - name: backend

        image: 931075223779.dkr.ecr.us-east-1.amazonaws.com/backend:latest

        ports:
        - containerPort: 8000