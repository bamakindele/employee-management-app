apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: development
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: backend-image-placeholder
        ports:
        - containerPort: 8000
        env:
        - name: db_username
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: db_username
        - name: db_password
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: db_password
