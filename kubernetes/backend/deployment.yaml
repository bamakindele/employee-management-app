apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend

  namespace: production

spec:

  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:

    metadata:
      labels:
        app: backend

    spec:

      containers:

      - name: backend

        image: 931075223779.dkr.ecr.us-east-1.amazonaws.com/backend:latest

        ports:
        - containerPort: 8000