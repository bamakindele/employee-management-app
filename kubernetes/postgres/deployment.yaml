apiVersion: apps/v1
kind: Deployment

metadata:
  name: postgres
  namespace: development

spec:

  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:

    metadata:
      labels:
        app: postgres

    spec:

      containers:

      - name: postgres

        image: postgres:15

        env:
        - name: POSTGRES_HOST_AUTH_METHOD
          value: trust